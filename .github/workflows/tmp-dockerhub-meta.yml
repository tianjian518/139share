name: tmp-dockerhub-meta

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clean DockerHub description
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -x
          JWT=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")

          if [ -z "$JWT" ]; then
            echo "❌ 登录失败，未取得 JWT"
            exit 1
          fi
          echo "✅ 已取得 JWT（长度 ${#JWT}）"

          echo "===== PATCH description ====="
          curl -s -o /tmp/resp.json -w "HTTP=%{http_code}\n" \
            -X PATCH "https://hub.docker.com/v2/repositories/${DH_USER}/139share/" \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT ${JWT}" \
            -d '{"description":"","full_description":""}'
          head -c 1000 /tmp/resp.json

          echo ""
          echo "===== 复核当前状态 ====="
          curl -s "https://hub.docker.com/v2/repositories/${DH_USER}/139share/" \
            -H "Authorization: JWT ${JWT}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('description =', repr(d.get('description'))); print('full_description =', repr(d.get('full_description'))[:120])"
